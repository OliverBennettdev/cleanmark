name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm --filter @cleanmark/web build

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/cleaner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest -q

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - run: docker compose build
      - run: docker compose up --detach
      - name: Smoke test web and cleaner proxy
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000 >/dev/null; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              docker compose logs
              exit 1
            fi
            sleep 2
          done
          printf 'hello\u200bworld' > /tmp/cleanmark-sample.txt
          curl --fail --silent --show-error \
            -F file=@/tmp/cleanmark-sample.txt \
            http://127.0.0.1:3000/api/inspect \
            | grep 'U+200B'
      - if: always()
        run: docker compose down --volumes
